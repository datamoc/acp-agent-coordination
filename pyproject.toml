[project]
name = "acp-agent-coordination"
version = "0.2.0"
description = "Local Agent Communication Protocol server so concurrent coding sessions can coordinate (mailbox + presence)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "acp-sdk>=1.0.3",
    "uvicorn<0.35",
]

[project.scripts]
acp-coordination-server = "ACP_server:main"
acp-coordination-client = "ACP_client:main"
coord = "coord:main"
coord-server = "coordination.server:main"
coord-admin = "coordination.pki:main"

[project.optional-dependencies]
gitlab = [
    "python-gitlab>=8.5.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["ACP_server", "ACP_client", "store", "coord"]
packages = ["coordination"]

[tool.uv]
# Use the OS trust store: behind a TLS-intercepting corporate proxy, uv's
# bundled roots reject PyPI and building this project (setuptools) fails.
system-certs = true
