# GitLab CI: the same suites as .github/workflows/ci.yml (Python server + TS client), across the
# same Python 3.11-3.14 matrix (v2 §18) - macOS is GitHub-only, since GitLab.com's macOS runners
# are a paid SaaS tier and self-hosted "internal" instances rarely have one at all.
#
# Project/group CI variables you may need on an internal instance:
#   UV_IMAGE_PREFIX    prefix of an image with uv + Python, PY_VERSION appended (Node 22 is added
#                      if missing); mirror it if runners cannot reach ghcr.io, e.g.
#                      registry.internal/uv:python (default ghcr.io/astral-sh/uv:python)
#   CORPORATE_CA_PEM   "File" variable with the corporate root CA, when PyPI is reached
#                      through a TLS-inspecting proxy (pyproject sets uv system-certs)
#   UV_INDEX_URL       an internal PyPI mirror (e.g. a GitLab/Nexus proxy), if any
#   WINDOWS_RUNNER_TAG tag of a Windows runner with uv installed; the Windows job only
#                      exists when this is set

variables:
  UV_IMAGE_PREFIX: ghcr.io/astral-sh/uv:python
  UV_CACHE_DIR: .uv-cache
  UV_LINK_MODE: copy

workflow:
  rules:                      # one pipeline per change: MR pipelines, else branch pipelines
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

stages: [test]

.uv-cache:
  cache:
    key:
      files: [uv.lock]
    paths: [.uv-cache]

test:linux:
  stage: test
  image: "${UV_IMAGE_PREFIX}${PY_VERSION}-bookworm-slim"
  parallel:
    matrix:
      - PY_VERSION: ["3.11", "3.12", "3.13", "3.14"]
  extends: .uv-cache
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends openssl git ca-certificates >/dev/null
    - |
      if [ -n "$CORPORATE_CA_PEM" ]; then
        cp "$CORPORATE_CA_PEM" /usr/local/share/ca-certificates/corporate-ca.crt && update-ca-certificates >/dev/null
      fi
    - uv sync --locked --group dev
    - |
      if ! command -v node >/dev/null; then
        apt-get install -y -qq --no-install-recommends nodejs npm >/dev/null
      fi
  script:
    - uv run tools/gen_schema.py --check
    - uv run tools/agent_plugins.py gen --check
    - uv run ruff check coordination tools
    - uv run pyright coordination tools
    - uv run test_coord.py
    - cd clients/ts && npm ci && npm test
    - npm run bundle-plugin && git diff --exit-code -- ../../plugins/coord/client
  after_script:
    - uv cache prune --ci

test:windows:
  stage: test
  tags: [$WINDOWS_RUNNER_TAG]
  extends: .uv-cache
  script:
    - uv sync --locked
    - uv run tools/gen_schema.py --check
    - uv run tools/agent_plugins.py gen --check
    - uv run test_coord.py
    - cd clients/ts; npm ci; npm test
  rules:
    - if: $WINDOWS_RUNNER_TAG == null || $WINDOWS_RUNNER_TAG == ""
      when: never
    - when: on_success
