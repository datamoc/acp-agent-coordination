name: ci
on: [push, pull_request]
jobs:
  # Python across every supported version and OS (v2 §18): the server is stdlib-only, so this is
  # what actually needs the matrix. The schema/plugin/TS checks below don't vary by Python version,
  # so they run once (matrix job) rather than once per combination.
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # tests build fixtures from the release tags (T30): a shallow clone has none
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - run: uv run test_coord.py                     # server, PKI, renewal, OIDC, cert sources
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # tests build fixtures from the release tags (T30): a shallow clone has none
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: uv sync --locked --group dev
      - run: uv run tools/gen_schema.py --check       # the wire contract matches the server
      - run: uv run tools/agent_plugins.py gen --check # Gemini/Qwen commands match claude-commands/
      - run: uv run ruff check coordination tools      # lint (T25)
      - run: uv run pyright coordination tools         # types (T25); tsc --strict runs via npm test below
      - run: uv run test_coord.py                     # server, PKI, renewal, OIDC, cert sources
      - run: npm ci
        working-directory: clients/ts
      - run: npm test                                 # TS client against the real Python server
        working-directory: clients/ts
      - run: npm run bundle-plugin && git diff --exit-code -- plugins/coord/client
        working-directory: clients/ts
        shell: bash
  # What a user installs (T26, v2 §18): the wheel and the npm tarball, each installed into a
  # fresh, isolated environment, then coord-server + coord whoami end to end - the same script
  # the GitLab job runs. Linux only: the wheel is py3-none-any and the tarball is plain JS, and
  # the matrix above already covers the checkout path on Windows/macOS.
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # tests build fixtures from the release tags (T30): a shallow clone has none
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bash tools/install-smoke.sh
